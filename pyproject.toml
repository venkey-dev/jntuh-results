[project]
name = "jntuh-results-backend"
version = "1.0.0"
description = "JNTUH Academic Results Backend and Web Interface"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.95.2",
    "uvicorn>=0.22.0",
    "aiohttp>=3.8.4",
    "beautifulsoup4>=4.12.2",
    "lxml>=4.9.2",
    "pydantic>=1.10.7"
]

[tool.vercel]
entrypoint = "results.main:app"
